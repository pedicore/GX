<!DOCTYPE html>
<html lang="en" class="loading">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/main.css">
    <title>GX</title>
</head>

<body class="animated-gradient">
    <div class="app-layout">
        <!-- Side bar and Logo -->
        <aside class="sidebar">
            <div class="logo">

            </div>
            <button id="sidebar-toggle">
                <svg class="icon-open" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-panel-right-open preview-icon">
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M15 3v18" />
                    <path d="m10 15-3-3 3-3" />
                </svg>
                <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-panel-right-close preview-icon">
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M15 3v18" />
                    <path d="m8 9 3 3-3 3" />
                </svg>
            </button>
            <nav class="nav">
                <div class="buttonDisplay">
                    <button class="active" type="button"><span>Dashboard</span><svg xmlns="http://www.w3.org/2000/svg"
                            width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-layout-dashboard preview-icon">
                            <rect width="7" height="9" x="3" y="3" rx="1" />
                            <rect width="7" height="5" x="14" y="3" rx="1" />
                            <rect width="7" height="9" x="14" y="12" rx="1" />
                            <rect width="7" height="5" x="3" y="16" rx="1" />
                        </svg></button>
                    <button type="button"><span>Processes</span> <svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu preview-icon">
                            <path d="M4 5h16" />
                            <path d="M4 12h16" />
                            <path d="M4 19h16" />
                        </svg></button>
                    <button type="button"><span>Performance</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-square-activity preview-icon">
                            <rect width="18" height="18" x="3" y="3" rx="2" />
                            <path d="M17 12h-2l-2 5-2-10-2 5H7" />
                        </svg>
                    </button>
                    <button type="button"><span>Settings</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-settings preview-icon">
                            <path
                                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                    <div class="theme-section">
                        <button id="themeBtn" class="theme-toggle">
                            <svg xmlns="http://www.w3.org/2000/svg" class="moon-icon" width="24" height="24"
                                viewBox="0 0 24 24" fill="white" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon preview-icon">
                                <path
                                    d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
                            </svg>


                            <svg xmlns="http://www.w3.org/2000/svg" class="sun-icon" width="24" height="24"
                                viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun preview-icon">
                                <circle cx="12" cy="12" r="4" />
                                <path d="M12 2v2" />
                                <path d="M12 20v2" />
                                <path d="m4.93 4.93 1.41 1.41" />
                                <path d="m17.66 17.66 1.41 1.41" />
                                <path d="M2 12h2" />
                                <path d="M20 12h2" />
                                <path d="m6.34 17.66-1.41 1.41" />
                                <path d="m19.07 4.93-1.41 1.41" />
                            </svg>
                        </button>
                    </div>
                </div>
            </nav>
        </aside>
        <!-- Main , Header -->
        <main>
            <header>
                <h1 class="hedearTitle">Dashboard</h1>
            </header>
            <div id="overview">
                <div id="system-cards">


                </div>


            </div>
            <div class="chart-container">
                <h3>CPU Usage</h3>
                <div class="chart-area">
                    <canvas id="cpu-chart"></canvas>
                </div>
                <div class="chart-area">
                    <h3>Ram Usage</h3>
                    <canvas id="ram-chart"></canvas>
                </div>
            </div>

            <div class="parent-file">
                <div class="recent-file" id="file">
                    <button id="activityBtn">Recent Activityes
                        <svg xmlns="http://www.w3.org/2000/svg" id="arrow" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-arrow-down preview-icon">
                            <path d="M12 5v14" />
                            <path d="m19 12-7 7-7-7" />
                        </svg>
                    </button>

                </div>
            </div>


        </main>

    </div>


    <script src="js/vendor/chart.umd.min.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/components/SystemCard.js"></script>
    <script src="./js/theme.js"></script>
</body>

</html>
